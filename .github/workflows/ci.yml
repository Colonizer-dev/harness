# Runs the checks every pull request has to pass: the Rust tests and lint, the Claude Code runner's
# tests, the live map's receiver's tests, and the web UI's build and tests. Each piece is its own job
# so a red run names what broke.
#
# `cargo fmt --all --check` gates the tree, which was formatted in one pass against the `rustfmt.toml`
# at the repository root (width 130 — the style the tree was already written in).
#
# Node 24 is what every other workflow pins and what the colony image (node:24-bookworm) runs;
# engines floors at 20, and CI checks the newest runtime people actually run.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Nothing here publishes, so a superseded run's result is worthless: only the newest commit on a ref
# matters, and an older one still running is just queued minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same toolchain the release builds use: stable, minimal profile.
      - name: Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      # Test and clippy share this cache; the target dir makes the second run of a branch cheap.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # Every entry in Cargo.lock must resolve from the registry, into an empty cargo home so the warm
      # cache above cannot hide an entry the registry no longer has; a phantom lock entry passed CI
      # once and only failed the release build (#313). Fetch-only, so it costs a download, no compile.
      - name: Lockfile resolves
        run: CARGO_HOME="$(mktemp -d)" cargo fetch --locked

      # Includes colonizer-agentd's integration and smoke tests, which boot the real agentd binary on
      # loopback against a stub agent runner. Python3 is the only thing they need beyond cargo, and
      # stock runners have it; no KVM is involved anywhere in this job. --locked, like the release
      # build: a lockfile cargo would have to change fails here instead of being silently re-resolved.
      - name: Test
        run: cargo test --workspace --locked

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Last, so a formatting nit never hides a failing test or a real lint.
      - name: Format
        run: cargo fmt --all --check

  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/agents/claude-code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: modules/agents/claude-code/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      # The OpenCode runner has no dependencies (its MCP server is hand-rolled), so there is
      # nothing to install: plain `node --test` from the repository root.
      - name: Test the OpenCode runner
        working-directory: ${{ github.workspace }}
        run: node --test modules/agents/opencode/test/*.test.mjs

  # The measuring scripts (the colony report, the bench) and the build scripts. No dependencies
  # either, and none of the tests touch a mothership, a colony or the network; the job's one
  # network step is the staged-pack validation below, which downloads the pinned archives the
  # way an install does.
  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test
        run: node --test scripts/test/*.test.mjs

      # The packs an install actually ships, staged exactly as scripts/fetch-vendor.sh stages
      # them, checked against the full rule set in scripts/validate-plugins.mjs — the unit
      # tests above cover the validator; this runs it over what a colony can mount.
      - name: Validate the staged skill packs
        run: |
          VENDOR_KINDS="plugin prompt" sh scripts/fetch-vendor.sh
          node scripts/validate-plugins.mjs dist/plugins/*

      # The build scripts' tests drive the real scripts against stub uname, cargo and msb on PATH, so
      # they need no cargo, no microsandbox and no network; the happy paths need a Linux host, which
      # the runner is, and skip with a message anywhere else.
      - name: Test the build scripts
        run: sh scripts/test/build-scripts.test.sh

      # scripts/ci/check-exec-bits.sh scans the index (not the worktree) for shebang scripts that
      # lost their +x bit — the colony-commit failure of issue #455 — and its own test drives it
      # against throwaway repos, so neither needs cargo nor the network.
      - name: Check executable bits
        run: sh scripts/ci/check-exec-bits.sh

      - name: Test the exec-bit check
        run: sh scripts/test/check-exec-bits.test.sh

  # No lockfile and no dependencies: the receiver's tests import node's own modules and ../src only,
  # so there is nothing to install and `npm test` is plain `node --test`.
  telemetry:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: services/telemetry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test
        run: npm test

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The build is tsc --noEmit && vite build: it is the only place the UI's types are checked.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The colony report's tests import node's own modules and ../colony-report.mjs only; the repository
  # root has no package.json or lockfile, so there is nothing to install and `node --test` is the job.
  colony-report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test
        run: node --test scripts/test/colony-report.test.mjs

  # A real colony, end to end, on every pull request (issue #368): a real mothership (`colonizer
  # serve`), a real microVM through the vendored msb, real agentd, the real claude-code runner module
  # and the real Claude Code CLI, against a scratch git repository and a stub Anthropic-wire model
  # server — no GitHub writes, no paid model, no secrets. scripts/colony-e2e.mjs is the whole
  # harness: it launches everything, points the colony at the stub, and asserts it comes back
  # `no_changes` (the agent writes only /harness/out/pr.md, so there is nothing to commit). Like
  # every job here it runs on PRs and pushes to main, but it is deliberately not a required check: a
  # KVM-dependent job can flake on a runner difference, and a retry is cheaper than a blocked PR.
  #
  # install.sh itself is not run: a bundle drags in the web build, rtk and fetch-at-install
  # bookkeeping, none of which a colony boot reads. What is staged below is exactly what the
  # mothership resolves at boot — vendored msb, the pinned guest runtimes, the agent module — plus a
  # dummy Claude credential through the API, which the mothership only prefix-checks.
  colony-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Same toolchain the release builds use: stable, minimal profile.
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # Shares the rust job's cache family (its restore key is the fallback), so the mothership and
      # agentd builds start from a warm target/ (target/alpine* is the agentd build below) and registry.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/bin
            target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-e2e-${{ runner.os }}-
            cargo-${{ runner.os }}-

      # Hosted runners do have /dev/kvm but keep it from the runner user (root:kvm 0660), and msb's
      # libkrun needs it. release.yml's installer job does the same chmod.
      - name: Let the runner user use /dev/kvm
        run: sudo chmod 0666 /dev/kvm

      - name: Vendored microsandbox
        run: VENDOR_KINDS=msb scripts/fetch-vendor.sh

      # agentd is built the way install.sh builds it — inside a rust:1-alpine microVM, static musl —
      # because it runs in the colony's glibc 2.36 bookworm image and a host build on this glibc
      # 2.39 runner could demand symbol versions the image has not got (scripts/build-agentd.sh).
      - name: colonizer-agentd (static musl, built in a microVM)
        run: MSB="$PWD/dist/vendor/microsandbox/bin/msb" scripts/build-agentd.sh

      # The guest runtimes install.sh fetches from the host's own install: the Node the runner
      # command starts with, and the Claude Code CLI the runner drives (both sha256-pinned).
      - name: Guest runtimes (pinned Node and Claude Code)
        run: |
          scripts/fetch-node-binary.sh
          scripts/fetch-agent-binary.sh

      # install.sh's module staging, for the one module the run needs: the mothership discovers
      # agents under <assets>/modules/agents. --omit=optional as in a bundle: the colony runs the
      # Claude Code binary mounted at /opt/claude/bin/claude, not the SDK's platform package.
      - name: Stage the claude-code agent module
        run: |
          mkdir -p dist/modules/agents/claude-code
          (cd modules/agents/claude-code && tar --exclude=./node_modules --exclude=./test -cf - .) | tar -xf - -C dist/modules/agents/claude-code
          (cd dist/modules/agents/claude-code && npm ci --omit=dev --omit=optional --no-audit --no-fund --silent)

      # The exe resolves its assets from dist/ in the checkout (config.rs, resolve_assets), so no
      # install step is needed; --locked, like the rust job.
      - name: Build the mothership
        run: cargo build --release --locked -p colonizer-harness

      # The pinned colony image (the same digest install.sh --pull-image resolves), pulled up front
      # so a broken pin or a broken pull fails here, at a named step, instead of as a colony boot
      # timeout. msb caches images under $HOME/.microsandbox and the driver points the mothership's
      # HOME at the work dir, so the pull must target that same HOME or the boot re-downloads.
      - name: Pull the pinned colony image
        run: |
          image=$(awk '$1 !~ /^#/ && $6 == "node:24-bookworm" && $4 == "image" { print $6 "@sha256:" $5; exit }' crates/colonizer/images.lock)
          mkdir -p "$RUNNER_TEMP/colony-e2e/home"
          HOME="$RUNNER_TEMP/colony-e2e/home" dist/vendor/microsandbox/bin/msb pull "$image"

      # The driver prints a failure report itself and exits non-zero unless the colony reached
      # no_changes.
      - name: Run a colony end to end
        run: node scripts/colony-e2e.mjs --work "$RUNNER_TEMP/colony-e2e" --timeout-mins 20

      # The diagnostics the driver's failure report cites, not the whole work dir: home/ holds the
      # gigabyte msb image cache, and the scratch repo and worktrees say nothing the session logs
      # do not. The driver's own stdout (the full report) is in the step log regardless.
      - name: Upload the run's logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colony-e2e-logs
          path: |
            ${{ runner.temp }}/colony-e2e/serve.log
            ${{ runner.temp }}/colony-e2e/gh-calls.log
            ${{ runner.temp }}/colony-e2e/data/sessions
          if-no-files-found: ignore
          retention-days: 7
