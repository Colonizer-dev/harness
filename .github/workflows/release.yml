# Builds the prebuilt Colonizer apps and, for a version tag, publishes them as a GitHub release together
# with the one-command installer (scripts/install-release.sh, published as install.sh). docs/install.md
# tells people how to use them.
#
# - linux-binaries: colonizer-agentd and rtk for each colony architecture, and the harness for Linux, as
#   static musl binaries built inside rust:1-alpine. That is `docker run` from an ordinary job, because
#   GitHub's JavaScript actions don't run inside Alpine containers.
# - bundle: scripts/install.sh --bundle for each platform, then a smoke test: the app starts from the
#   unpacked archive, finds its assets there, and serves its API and web UI. The macOS leg wraps its
#   tarball in Colonizer.app: signed ad hoc, or Developer ID-signed and notarized on a tag push when
#   the APPLE_* secrets are configured in the release environment.
# - release: tags only. The tag has to match the version of both crates. Every published artifact — the
#   tarballs, the DMG, install.sh and SHA256SUMS — is attested with build provenance, and the release is
#   created as a draft, given all its assets, and only then published. The draft step is what makes
#   the release safe for GitHub's immutable releases, which freeze the assets and the tag the moment a
#   release is published, so nothing can be added or replaced afterwards. Immutability itself is a repository
#   setting (Settings → Releases → "Enable release immutability"), not anything a workflow can commit:
#   this workflow is ready for it, and flipping that toggle is the missing half.
# - crates: tags only, after the release. Publishes colonizer-agentd and colonizer-harness to crates.io
#   through Trusted Publishing (no stored token), skipping a version crates.io already has. The crates are
#   the source, not an install: the site and docs send people to the release installer.
#
# A release contains no Anthropic code: the Claude Agent SDK and Claude Code are fetched where the app
# is installed (scripts/install.sh --bundle and scripts/install-release.sh say how).
name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/install.sh
      - scripts/install-release.sh
      - scripts/test/install-release.test.sh
      - scripts/record-fetch-at-install.mjs
      - scripts/build-agentd.sh
      - scripts/build-rtk.sh
      - scripts/build-tailscaled.sh
      - scripts/build-dmg.sh
      - scripts/fetch-vendor.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-binaries:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch rtk's pinned source
        run: VENDOR_KINDS=source scripts/fetch-vendor.sh

      - name: Build inside rust:1-alpine
        env:
          ARCH: ${{ matrix.arch }}
          # The container has no git, so the harness is told which release it is (crates/colonizer/build.rs).
          # Empty off a tag, and build.rs then asks git as usual.
          COLONIZER_DESCRIBE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          COLONIZER_COMMIT: ${{ github.sha }}
        run: |
          # The image is pinned by digest, because the tag alone would move under us between builds.
          # The tag stays in the reference so a human can still read it; the digest is what pins it.
          docker run --rm -e ARCH -e COLONIZER_BUILD_HERE=1 -e COLONIZER_DESCRIBE -e COLONIZER_COMMIT -e OWNER="$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src rust:1-alpine@sha256:1716b3aa042d735f4566d14dc54e8037de9d69556e2d5dd58131d93a613d173d sh -euc '
              apk add --no-cache musl-dev file >/dev/null
              scripts/build-agentd.sh
              scripts/build-rtk.sh
              # The harness runs on the host, so only the Linux app needs a Linux build of it.
              if [ "$ARCH" = x86_64 ]; then
                cargo build --release --locked -p colonizer-harness
                install -m 755 target/release/colonizer dist/bin/colonizer
              fi
              chown -R "$OWNER" dist target
            '
          mkdir -p prebuilt
          cp dist/bin/colonizer-agentd dist/bin/rtk prebuilt/
          [ "$ARCH" != x86_64 ] || cp dist/bin/colonizer prebuilt/
          file prebuilt/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-binaries-${{ matrix.arch }}
          path: prebuilt/
          if-no-files-found: error
          retention-days: 7

  bundle:
    needs: linux-binaries
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            guest: x86_64
          - platform: darwin-arm64
            runner: macos-15
            guest: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # An empty environment name is "no environment" (the workflow syntax docs): a tag push runs in the
    # `release` environment and sees its APPLE_* secrets, a pull request runs in none and stays ad
    # hoc. Step-level `if` cannot read `secrets.*`, so these flags carry secret presence down to the
    # steps below; they hold yes/no, never the secrets themselves.
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || '' }}
    env:
      PLATFORM: ${{ matrix.platform }}
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dev-{0}', github.sha) }}
      APPLE_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && 'yes' || 'no' }}
      APPLE_SIGNING: ${{ secrets.APPLE_DEVELOPER_ID_P12 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' && 'yes' || 'no' }}
      APPLE_NOTARY: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER_ID != '' && 'yes' || 'no' }}
    outputs:
      # The publish job has no environment and reads no secrets, so notarization reaches it as
      # this job's output rather than as another look at the secret list.
      dmg_notarized: ${{ steps.notarize.outputs.dmg_notarized }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Rust
        if: matrix.platform == 'darwin-arm64'
        run: rustup toolchain install stable --profile minimal && rustup default stable

      # macos-15 ships Go only in the hosted toolcache, not on PATH, so the Mac leg has to put one there for scripts/build-tailscaled.sh.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.platform == 'darwin-arm64'
        with:
          # The newest Go 1.x, like the golang:1-alpine the microVM path builds in: no pin to go stale.
          go-version: '1.x'
          cache: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-binaries-${{ matrix.guest }}
          path: prebuilt

      - name: Build the app
        env:
          # The macos-15 runner has never run a microVM and its nested virtualisation is unreliable, so
          # the Mac leg builds tailscaled with the runner's own Go. That is safe for the other build
          # scripts: on this job their Linux binaries come from prebuilt_bin, so build-tailscaled.sh is
          # the only one that sees COLONIZER_BUILD_HERE.
          COLONIZER_BUILD_HERE: ${{ matrix.platform == 'darwin-arm64' && '1' || '' }}
          # The Mac leg builds the harness here; stamped the same way as the Linux one above.
          COLONIZER_DESCRIBE: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          COLONIZER_COMMIT: ${{ github.sha }}
        run: |
          chmod 755 prebuilt/*
          COLONIZER_PREBUILT="$PWD/prebuilt" scripts/install.sh --bundle

      # The macOS signing and notarization secrets, issue #1138. A Developer ID signature on the
      # mothership binary and the app is what makes macOS Keychain grants survive updates: the grant
      # is tied to the signing identity, and a release signed with the same certificate every time
      # keeps it. The certificate (a base64 .p12) is unpacked into a throwaway keychain under
      # $RUNNER_TEMP and deleted again at the end of the job.
      - name: Refuse a partial set of Apple credentials
        if: matrix.platform == 'darwin-arm64' && env.APPLE_P12 == 'yes' && (env.APPLE_SIGNING != 'yes' || env.APPLE_NOTARY != 'yes')
        run: |
          if [ "$APPLE_SIGNING" != yes ]; then
            echo "APPLE_DEVELOPER_ID_P12 is set without APPLE_DEVELOPER_ID_P12_PASSWORD, the certificate's" >&2
            echo "export password, so it cannot be imported. Set the password or remove the certificate." >&2
          fi
          if [ "$APPLE_NOTARY" != yes ]; then
            echo "APPLE_DEVELOPER_ID_P12 is set, but notarization also needs APPLE_NOTARY_KEY_P8," >&2
            echo "APPLE_NOTARY_KEY_ID and APPLE_NOTARY_ISSUER_ID in the release environment." >&2
          fi
          echo "A Developer ID signature without a notarization ticket is still Gatekeeper-blocked," >&2
          echo "so set all five APPLE_* secrets, or none and keep the ad hoc DMG." >&2
          exit 1

      - name: Import the Developer ID certificate
        if: matrix.platform == 'darwin-arm64' && env.APPLE_SIGNING == 'yes'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/colonizer-signing.keychain"
          pass=$(openssl rand -hex 32)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          printf '%s' "$APPLE_DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          # Lets codesign use the imported key without a GUI prompt for it.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$pass" "$keychain"
          # codesign resolves the identity through the keychain search list, so the build keychain
          # becomes it; the job uses nothing from the login keychain, which the runner forgets anyway.
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/^ *[0-9]+\) / { print $2; exit }')
          [ -n "$identity" ] || { echo "no valid codesigning identity in APPLE_DEVELOPER_ID_P12" >&2; exit 1; }
          echo "DMG_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      # Signed before the Package step tars it, so both the tarball and the DMG carry the release
      # identity. --identifier matches what install-release.sh re-signs with (docs/updates.md).
      - name: Sign the mothership binary
        if: matrix.platform == 'darwin-arm64' && env.APPLE_SIGNING == 'yes'
        run: |
          codesign --force --options runtime --timestamp --sign "$DMG_SIGN_IDENTITY" \
            --identifier dev.colonizer.mothership dist/bin/colonizer
          codesign --verify --strict dist/bin/colonizer

      - name: Package
        run: |
          printf '%s\n' "$VERSION" > dist/VERSION
          cp LICENSE NOTICE dist/
          # Anthropic's code stays out: install-release.sh fetches it where the app is installed.
          if find dist -path '*/node_modules/@anthropic-ai/claude-agent-sdk*' | grep -q .; then
            echo "the Claude Agent SDK is in the bundle" >&2
            exit 1
          fi
          mkdir -p stage out
          cp -R dist stage/colonizer
          tar -C stage -czf "out/colonizer-$PLATFORM.tar.gz" colonizer
          ls -lh out

      - name: Smoke test
        run: |
          set -o pipefail
          mkdir -p smoke/home
          tar -xzf "out/colonizer-$PLATFORM.tar.gz" -C smoke
          # A release must know it is one: a build that reads as a development build refuses to update itself.
          smoke/colonizer/bin/colonizer version | tee smoke/version
          if [ "${VERSION#dev-}" = "$VERSION" ]; then
            read -r stamped _ < smoke/version
            [ "$stamped" = "$VERSION" ] || { echo "the app reports $stamped, not $VERSION" >&2; exit 1; }
            if grep -q "development build" smoke/version; then
              echo "the app reports itself as a development build" >&2
              exit 1
            fi
          fi
          # COLONIZER_NO_BROWSER: the app opens its sign-in link at startup, and a runner has no one to see it.
          HOME="$PWD/smoke/home" COLONIZER_BIND=127.0.0.1:17878 COLONIZER_GATEWAY_BIND=127.0.0.1:17879 \
            COLONIZER_NO_BROWSER=1 smoke/colonizer/bin/colonizer > smoke/log 2>&1 &
          pid=$!
          for _ in $(seq 60); do
            curl -fsS -o /dev/null http://127.0.0.1:17878/api/status && break
            sleep 1
          done
          cat smoke/log
          grep -q "^assets: .*/smoke/colonizer$" smoke/log
          # Since #405 the full status and the UI need the per-install API token; without it
          # /api/status answers only counts and health, and / answers 401.
          token=$(cat smoke/home/.config/colonizer/api-token)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:17878/api/status | tee smoke/status.json
          echo
          # The app found its own parts: the in-VM daemon, the web UI and the Claude Code module.
          grep -q '"agentd":true' smoke/status.json
          grep -q '"web":true' smoke/status.json
          grep -q '"claude-code"' smoke/status.json
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:17878/ | grep -qi '<html'
          kill "$pid"

      # Colonizer.app around the tarball just built and smoke-tested, in a DMG with a stable name:
      # ad hoc unless the Developer ID identity above was imported, in which case build-dmg.sh signs
      # the app and the DMG with it (and the notarization step below attaches the ticket).
      - name: Build the macOS app (DMG)
        if: matrix.platform == 'darwin-arm64'
        env:
          COLONIZER_DMG_IDENTITY: ${{ env.DMG_SIGN_IDENTITY || '-' }}
        run: |
          scripts/build-dmg.sh "out/colonizer-$PLATFORM.tar.gz" "$VERSION" out/Colonizer-arm64.dmg
          hdiutil verify out/Colonizer-arm64.dmg

      # The ticket is what turns the Developer ID signature into a DMG Gatekeeper opens without an
      # "Open Anyway". A submission that is not Accepted fails the job, printing Apple's log.
      - name: Notarize and staple the DMG
        id: notarize
        if: matrix.platform == 'darwin-arm64' && env.APPLE_SIGNING == 'yes' && env.APPLE_NOTARY == 'yes'
        env:
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          dmg=out/Colonizer-arm64.dmg
          key="$RUNNER_TEMP/notary-key.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$key"
          rejected=
          answer=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" \
            --issuer "$APPLE_NOTARY_ISSUER_ID" --wait --output-format json) || rejected=1
          printf '%s\n' "$answer"
          id=$(printf '%s' "$answer" | jq -r '.id // empty')
          status=$(printf '%s' "$answer" | jq -r '.status // empty')
          if [ -n "$rejected" ] || [ "$status" != Accepted ]; then
            # Apple's verdict on why it was rejected; notarytool log needs the submission id.
            if [ -n "$id" ]; then
              xcrun notarytool log "$id" --key "$key" --key-id "$APPLE_NOTARY_KEY_ID" \
                --issuer "$APPLE_NOTARY_ISSUER_ID" || true
            fi
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          hdiutil verify "$dmg"
          spctl --assess --type open --context context:primary-signature -v "$dmg"
          echo "dmg_notarized=yes" >> "$GITHUB_OUTPUT"
          # And the app a user would actually open, assessed where it ships: on the image itself.
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          rc=0
          spctl --assess --type execute -v "$mount/Colonizer.app" || rc=$?
          hdiutil detach "$mount"
          exit "$rc"

      - name: Remove the signing material
        if: always() && matrix.platform == 'darwin-arm64'
        run: |
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"
          security delete-keychain "$RUNNER_TEMP/colonizer-signing.keychain" 2>/dev/null || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: colonizer-${{ matrix.platform }}
          path: |
            out/colonizer-${{ matrix.platform }}.tar.gz
            out/Colonizer-arm64.dmg
          if-no-files-found: error
          retention-days: 7

  installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The installer refuses to install where colonies cannot run, and hosted runners have /dev/kvm
      # but keep it from the runner user. Missing device should fail loudly, not skip the test.
      - name: Let the runner user use /dev/kvm
        run: sudo chmod 0666 /dev/kvm

      - name: Test the installer
        run: sh scripts/test/install-release.test.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No environment: this job reads no secrets. Whether the DMG was notarized comes from the
    # bundle job's output above, not from probing the secret list again.
    # id-token: write mints the Sigstore signing certificate for the attestations through OIDC;
    # attestations: write stores the attestations on the repository; artifact-metadata: write is the
    # storage record the attestation action requires; contents: write publishes the release itself.
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      DMG_NOTARIZED: ${{ needs.bundle.outputs.dmg_notarized == 'yes' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tag against the crate versions
        run: |
          for manifest in crates/colonizer/Cargo.toml crates/colonizer-agentd/Cargo.toml crates/colonizer-redact/Cargo.toml; do
            crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)
            [ "$TAG" = "v$crate" ] || { echo "tag $TAG does not match $manifest version $crate" >&2; exit 1; }
          done

      # The section for the tag exists, and no changelog.d/ fragment was left out of it: a fragment
      # still pending at the tagged commit is an entry this release would ship without.
      - name: Check the changelog covers the tag
        run: node scripts/changelog.mjs check --release "$TAG"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: colonizer-*
          path: release
          merge-multiple: true

      - name: Checksum the artifacts and write the release notes
        run: |
          cp scripts/install-release.sh release/install.sh
          cd release
          sha256sum colonizer-*.tar.gz Colonizer-arm64.dmg install.sh > SHA256SUMS
          cat SHA256SUMS
          # Issue #1097: the critical and fixes-running notices come first, as a visible list and a
          # block `/api/update` reads (it carries the notices of the releases just before, too), so a
          # mothership hears why the update matters. Nothing is printed when there are none. Then a
          # shipped, per-release notes file (docs/release-notes/<tag>.md, if the tagged commit has
          # one), above the generic text every release carries below.
          {
            node ../scripts/changelog.mjs notices --release "$TAG"
            if [ -f "../docs/release-notes/$TAG.md" ]; then
              # Drop the HTML comment the file opens with (it would show in the release body).
              perl -0pe 's/<!--.*?-->\s*//gs' "../docs/release-notes/$TAG.md"
              echo
            fi
          } > notes.md
          {
            echo "Prebuilt Colonizer for Linux x86_64 (with KVM) and Apple Silicon Macs, built from ${{ github.sha }}."
            echo
            echo '```sh'
            echo 'curl -fsSL https://colonizer.dev/install.sh | sh'
            echo '```'
            echo
            echo "The installer checks the archive against SHA256SUMS. It fetches the Claude Agent SDK from the npm registry, and on a Mac the Linux build of Claude Code, from Anthropic's own channels: neither is in the release. Guide: https://colonizer.dev/docs/install"
            echo
            echo "Each artifact, SHA256SUMS included, also carries a build-provenance attestation recording the commit that built it. Verify one with:"
            echo
            echo '```sh'
            echo 'gh attestation verify colonizer-<platform>.tar.gz --repo Colonizer-dev/harness'
            echo '```'
            echo
            echo 'Here <platform> is linux-x86_64 or darwin-arm64.'
            echo
            if [ "$DMG_NOTARIZED" = yes ]; then
              echo "Apple Silicon Macs can also use Colonizer-arm64.dmg: a Developer ID-signed, notarized app, which macOS opens like any other download. The curl installer above is the recommended path."
            else
              echo "Apple Silicon Macs can also use Colonizer-arm64.dmg: an unsigned app, so macOS asks you to approve it once (System Settings > Privacy & Security > Open Anyway). The curl installer above is the recommended path."
            fi
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> notes.md

      # Attests build provenance for the tarballs, the installer and SHA256SUMS itself: an installer
      # that has verified the checksums file can then trust every digest it lists. Artifact
      # attestations are free for public repositories. The paths carry the release/ prefix because
      # uses steps ignore working-directory and resolve paths against the workspace root.
      - name: Attest the release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/colonizer-*.tar.gz, release/Colonizer-arm64.dmg, release/install.sh, release/SHA256SUMS

      - name: Publish
        run: |
          cd release
          # The release is created as a draft with every asset attached, and published only once
          # everything is up. That is not gratuitous: GitHub's immutable releases freeze the assets
          # and the tag the moment a release is published, so an asset attached afterwards would be
          # rejected — attaching everything to the draft first is the only order that works. It is
          # also good practice without immutability: a half-uploaded release is never visible.
          gh release create "$TAG" colonizer-*.tar.gz Colonizer-arm64.dmg install.sh SHA256SUMS \
            --draft --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Colonizer $TAG" --notes-file notes.md
          # --latest on publish: the app release claims "latest" deterministically, so a newer
          # bundle release (which is created with --latest=false) can never hold it instead.
          gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"

  crates:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Versions crates.io doesn't have yet
        id: pending
        run: |
          pending=""
          for crate in colonizer-redact colonizer-agentd colonizer-harness; do
            version=$(cargo metadata --no-deps --format-version 1 |
              jq -r --arg name "$crate" '.packages[] | select(.name == $name) | .version')
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "Colonizer-dev/harness release (contact@colonizer.dev)" \
              "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then
              echo "$crate $version is already on crates.io"
            else
              pending="$pending $crate"
            fi
          done
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: steps.pending.outputs.crates != ''
        id: auth

      - name: Publish
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          # colonizer-redact first: colonizer-harness depends on it, and cargo publish waits for it to
          # reach the index before the next one. Then colonizer-agentd: nothing depends on it, but the
          # harness README links to it.
          for crate in $CRATES; do
            cargo publish --locked -p "$crate"
          done
