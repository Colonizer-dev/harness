# Proposes new pins for the colony images (crates/colonizer/images.lock) and the guest Claude Code
# build (vendor/claude-code.lock) when their upstreams move, with the exact digest-to-digest or
# version-to-version change in the description. It never merges anything, and that is the point: a
# pin bump is a change to what every release runs — images.lock is compiled into the mothership
# binary itself — so a person reads the diff and merges every bump by hand.
#
# The update lands on the runtime/pin-updates branch. The workflow then opens a pull request, or,
# while the repository doesn't allow GitHub Actions to create pull requests (Settings → Actions →
# General), keeps an issue open with the same description and a link to open the pull request, and
# closes the issue once a run finds nothing to change.
name: Runtime pin updates

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: runtime-pin-updates
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: runtime/pin-updates
      TITLE: Update runtime pins
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check upstreams
        id: check
        run: node scripts/update-runtime-pins.mjs --write --summary "$RUNNER_TEMP/summary.md"

      # A run with nothing to propose closes the stand-in issue, if one is open. That covers two
      # cases: upstream hasn't moved, or someone merged the update branch ($BRANCH) by hand, after
      # which the next run finds the lock matching upstream and has nothing to change either.
      - name: Close the stale issue
        if: steps.check.outputs.changed != 'true'
        run: sh scripts/tracking-issue.sh close "$TITLE" "Runtime pins are current as of $(date -u +%Y-%m-%d)."

      # The Claude Code rows get the check a real install does: fetch-agent-binary.sh downloads the
      # newly pinned build and verifies it against the new checksum, so an update that fails that
      # never becomes a proposal. The image digests were already checked by the script itself — it
      # fetches a proposed index by digest and refuses one without linux/amd64 and linux/arm64.
      - name: Stage the new Claude Code pin
        if: steps.check.outputs.changed == 'true'
        run: sh scripts/fetch-agent-binary.sh

      # subagents.mjs redefines two built-in agents with verbatim copies: when the Claude Code pin
      # moved, re-extract them from the staged build into vendor/claude-code-builtins.json and put any
      # diff in the description. A failure here (stale copies, or a binary the script can no longer
      # read) doesn't hold the pin back: the snapshot or the copies then disagree with the lock and fail
      # CI on the pull request. The script runs some of the new build's JavaScript before anyone has
      # reviewed it, so it gets no environment (no GH_TOKEN) and, under Node's permission model, only
      # the files it needs — not the checkout's credentials in .git/config.
      - name: Check the built-in subagents
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git diff --quiet vendor/claude-code.lock || env -i PATH="$PATH" node --permission \
            --allow-fs-read=scripts/builtin-subagents.mjs --allow-fs-read=modules/agents/claude-code/subagents.mjs \
            --allow-fs-read=vendor/claude-code.lock --allow-fs-read=dist/bin/claude-guest \
            --allow-fs-write=vendor/claude-code-builtins.json --allow-fs-write="$RUNNER_TEMP/summary.md" \
            scripts/builtin-subagents.mjs --write --summary "$RUNNER_TEMP/summary.md" dist/bin/claude-guest

      # The Node runtime gets the same real-install check: fetch-node-binary.sh downloads the
      # pinned tarball and verifies it against node.lock, so a broken node pin never rides along.
      - name: Check the Node.js pin
        if: steps.check.outputs.changed == 'true'
        run: sh scripts/fetch-node-binary.sh

      - name: Propose
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add crates/colonizer/images.lock vendor/claude-code.lock vendor/node.lock vendor/claude-code-builtins.json
          git commit -m "$TITLE" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/summary.md"
            echo "Updated pull request #$existing"
            exit 0
          fi
          if gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "$TITLE" --body-file "$RUNNER_TEMP/summary.md"; then
            exit 0
          fi

          echo "Could not open a pull request; keeping an issue open instead."
          compare="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
          {
            echo "The update is on [\`$BRANCH\`]($compare): **[open the pull request]($compare)**."
            echo
            echo "_This repository doesn't let GitHub Actions open pull requests (Settings → Actions → General), so this issue stands in for one._"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/issue.md"
          sh scripts/tracking-issue.sh update "$TITLE" "$RUNNER_TEMP/issue.md"
