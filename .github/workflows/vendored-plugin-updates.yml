# Proposes new pins for the vendored Claude Code plugins (ECC, superpowers, Google's skills) and caveman's
# ruleset when their
# upstreams move, with the change described in skills added, removed and changed. It never merges
# anything: the skills are instructions to an agent that can push, so a person reads and merges.
#
# The update lands on the vendor/plugin-updates branch. The workflow then opens a pull request, or,
# while the repository doesn't allow GitHub Actions to create pull requests (Settings → Actions →
# General), keeps an issue open with the same description and a link to open the pull request, and
# closes the issue once a run finds nothing to change.
name: Vendored plugin updates

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vendored-plugin-updates
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BRANCH: vendor/plugin-updates
      TITLE: Update vendored plugins
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Check upstreams
        id: check
        run: node scripts/update-vendored-plugins.mjs --write --summary "$RUNNER_TEMP/summary.md"

      # A run with nothing to propose closes the stand-in issue, if one is open. That covers two
      # cases: upstream hasn't moved, or someone merged the update branch ($BRANCH) by hand, after
      # which the next run finds the lock matching upstream and has nothing to change either.
      - name: Close the stale issue
        if: steps.check.outputs.changed != 'true'
        run: sh scripts/tracking-issue.sh close "$TITLE" "Vendored plugins are current as of $(date -u +%Y-%m-%d)."

      # Staging runs every check a real install does: sha256, no hooks, no MCP servers, the Google
      # finder still reading its local catalog. An update that fails them never becomes a proposal.
      - name: Stage the new pins
        if: steps.check.outputs.changed == 'true'
        run: VENDOR_KINDS="plugin prompt" sh scripts/fetch-vendor.sh

      # The staged packs against the full skill-pack rule set, the same step CI runs: a pin whose
      # staged copy fails validation never becomes a proposal either (the updater already skipped
      # the pins it could check from their archives).
      - name: Validate the staged packs
        if: steps.check.outputs.changed == 'true'
        run: node scripts/validate-plugins.mjs dist/plugins/*

      - name: Propose
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add vendor/vendor.lock
          git commit -m "$TITLE" -m "$(cat "$RUNNER_TEMP/summary.md")"
          git push --force origin "$BRANCH"

          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file "$RUNNER_TEMP/summary.md"
            echo "Updated pull request #$existing"
            exit 0
          fi
          if gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" --title "$TITLE" --body-file "$RUNNER_TEMP/summary.md"; then
            exit 0
          fi

          echo "Could not open a pull request; keeping an issue open instead."
          compare="${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.repository.default_branch }}...$BRANCH?expand=1"
          {
            echo "The update is on [\`$BRANCH\`]($compare): **[open the pull request]($compare)**."
            echo
            echo "_This repository doesn't let GitHub Actions open pull requests (Settings → Actions → General), so this issue stands in for one._"
            echo
            cat "$RUNNER_TEMP/summary.md"
          } > "$RUNNER_TEMP/issue.md"
          sh scripts/tracking-issue.sh update "$TITLE" "$RUNNER_TEMP/issue.md"
