[package]
name = "colonizer"
version = "0.1.0"
edition = "2024"
description = "The Colonizer harness: coding agents in private microVMs, linked by a private mesh, returning pull requests"
license = "MIT"
repository = "https://github.com/Colonizer-dev/harness"
homepage = "https://colonizer.dev"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-socks = "0.5.3"
tokio-stream = "0.1.19"
tokio-tungstenite = "0.30.0"
toml = "1.1.6"
tower-http = { version = "0.7.1", features = ["fs"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
