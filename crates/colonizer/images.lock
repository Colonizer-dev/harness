# The colony images, pinned by OCI digest so every colony built from a given release boots exactly the bytes
# that release was tested with. The digest is the multi-arch OCI index digest, so one pin serves both
# linux/amd64 and linux/arm64 colonies.
#
# Compiled into the mothership, so it lives in this crate and is published with it. Same columns as
# vendor/vendor.lock: name, version, platform, kind, sha256, url. `name` is the preset id from src/presets.rs
# (go, not golang — the repository name lives in the reference in the url column), platform is `any` because
# the index covers both architectures, and `url` is the image reference the digest pins: a colony boots
# `<url>@sha256:<sha256>`. scripts/update-runtime-pins.mjs proposes new digests by pull request, the way the
# vendored plugins are updated.
