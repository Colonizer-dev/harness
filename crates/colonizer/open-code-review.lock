# The ocr binary (github.com/alibaba/open-code-review), one row per host platform: the raw static
# binary a release publishes, no archive. It is never fetched at install time: the mothership
# downloads it when someone asks for open-code-review in Settings (src/open_code_review.rs) and
# installs it to <data>/open-code-review/<release>/ocr; the platform is the host's (the review runs
# host-side), both OS and architecture.
#
# Compiled into the mothership. Same columns as vendor/vendor.lock: name, version, platform, kind,
# sha256, url. Each sha256 is that release's checksum for the asset. A release is pinned by pull
# request: bump every row at once, one per platform, sha256 from the release's published checksums.
