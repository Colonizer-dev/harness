# Loki for the Colonizer observability example stack. Ingests OTLP natively (Alloy pushes to
# /otlp/v1/logs) and implements the ADR's cardinality rule (docs/design/observability.md,
# "Cardinality and Loki labels"): service.name, colonizer.stream and the severity become index
# labels, everything else stays structured metadata, filterable in LogQL as
# `| colonizer_colony_id="…"` but never a stream. Labels live HERE, not in Alloy: Alloy ships
# every attribute and Loki decides what to index.
auth_enabled: false
server:
  http_listen_port: 3100
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
schema_config:
  configs:
    - from: 2020-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
limits_config:
  allow_structured_metadata: true
  otlp_config:
    resource_attributes:
      # service.name is the one resource attribute worth an index. ignore_defaults stops Loki
      # indexing its usual 18-attribute default list (k8s.pod.name and friends we never send).
      ignore_defaults: true
      attributes_config:
        - action: index_label
          attributes: [service.name]
    # colonizer.stream is a log-record attribute, not a resource one. Lists, not maps: each
    # entry names an action and the attributes it applies to.
    log_attributes:
      - action: index_label
        attributes: [colonizer.stream]
    # Opt into org as a fourth index label (ADR: only when the install opted in to sending it):
    #   - action: index_label
    #     attributes: [colonizer.org]
    severity_text_as_label: true
