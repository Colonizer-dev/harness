# The Codex builds colonies run, pinned so every install of the same Colonizer release gets the
# same agent. Same six columns as vendor/vendor.lock: name, version, platform, kind, sha256, url.
#
# Like modules/agents/opencode/opencode.lock this file is read where the agent is fetched (the
# runner itself, at colony boot) rather than bundled: a release carries no Codex code. The runner
# downloads the row for its architecture from the GitHub release assets, checks the sha256, and only
# then extracts the single binary at the archive root (the URL's basename without the .tar.gz). The
# artifacts are the static musl builds; there is no AVX2 split, so x64 takes linux-x64 and colonies
# on Apple Silicon take linux-arm64.
