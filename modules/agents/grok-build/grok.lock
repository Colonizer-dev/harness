# The Grok Build CLI builds colonies run, pinned so every install of the same Colonizer release gets
# the same agent. Same six columns as vendor/vendor.lock: name, version, platform, kind, sha256, url.
#
# Like crates/colonizer/claude-code.lock this file is read where the agent is fetched (here the runner
# itself, at colony boot) rather than bundled: a release carries no grok code. Upstream publishes no
# GitHub releases — the url is the artifact the official installer (https://x.ai/cli/install.sh) pulls,
# a single gzip'd static ELF rather than a tarball. The runner downloads the row for its architecture
# from x.ai into a scratch dir, checks the sha256 of the compressed download, and only then
# decompresses it (node:zlib gunzipSync) into the cache. There is no baseline build, so the two guest
# architectures map one to one.
