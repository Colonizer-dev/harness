# hermes-agent pinned by its source commit, plus the uv build that installs it
# and a Python for images without a usable one.
# Same six columns as vendor/vendor.lock: name, version, platform, kind, sha256, url.
#
# Hermes publishes no release binaries, and PyPI stops at 0.19.0, so the runner builds it at
# colony boot (stage.mjs) instead of extracting a binary. It downloads each row and checks the
# sha256 before using it. Then it creates a venv and installs hermes-requirements.lock with
# `uv pip install --require-hashes --only-binary :all:` (every dependency pinned by hash, wheels
# only), then the source tree itself with --no-deps --no-build-isolation, using the hash-pinned
# setuptools and wheel from that lock.
#
# Kinds:
#   source        the GitHub tarball of the tag's exact commit (the url names the commit; it must
#                 match requires.pins.hermes.source_rev in module.json)
#   requirements  the sha256 of hermes-requirements.lock next to this file, so the two cannot drift
#   tool          uv, per architecture, from its GitHub release
#   python        a python-build-standalone CPython, per architecture, used only when the image has
#                 no python3.11-3.13 on PATH
#
# Regenerate everything with `node scripts/pin-hermes.mjs <tag>`.
