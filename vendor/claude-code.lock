# The Claude Code build that colonies run, pinned so every install of the same Colonizer release
# gets the same agent. Same six columns as vendor/vendor.lock: name, version, platform, kind, sha256, url.
#
# Not in vendor/vendor.lock on purpose: that file pins what is bundled with the app, and a release
# carries no Anthropic code — it is not ours to redistribute. This build is fetched where the app is
# installed instead (scripts/fetch-agent-binary.sh for a source build, the guest_claude step of
# scripts/install-release.sh for a prebuilt one), and the lock itself is copied into dist/ so both
# read the same pin.
#
# The checksums are the values from Anthropic's own release manifest for the version, not sums taken
# offline once. scripts/update-runtime-pins.mjs checks Anthropic's stable channel daily and proposes
# a new version by pull request; a human merges it. That is what bounds staleness: a release stays
# reproducible, and the pin only ages for as long as that pull request sits unmerged.
#
# Platform names here are the guest ones Anthropic uses (linux-arm64, linux-x64), not Colonizer's own
# release platform names (linux-x86_64, darwin-arm64). The guest is always Linux — a colony is a Linux
# microVM — so there is no darwin row even though a Mac is where this lock is most often read.
