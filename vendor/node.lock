# The Node.js runtime that colonies run, pinned so every install of the same Colonizer release
# gets the same runtime. Same six columns as vendor/vendor.lock: name, version, platform, kind, sha256, url.
#
# The preset colony image is node:24-bookworm, so this pins the matching Node 24 LTS (Krypton) Linux
# builds from nodejs.org: one row per guest platform, with the tarball checksums from that release's
# own SHASUMS256.txt. The tarball — not the extracted binary — is what the checksum verifies, before
# bin/node is extracted (scripts/fetch-node-binary.sh for a source build, the guest_node step of
# scripts/install-release.sh for a prebuilt one), and the lock itself is copied into dist/ so both
# read the same pin.
#
# Platform names here are the guest ones nodejs.org uses (linux-arm64, linux-x64), not Colonizer's own
# release platform names (linux-x86_64, darwin-arm64). The guest is always Linux — a colony is a Linux
# microVM — so there is no darwin row even though a Mac is where this lock is most often read.
node  24.21.0  linux-arm64  runtime  6ad1325edbdb5649c379b75a237147a666c95d4f9ae8d340fef2d1575d289ad2  https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-arm64.tar.xz
node  24.21.0  linux-x64    runtime  fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6  https://nodejs.org/dist/v24.21.0/node-v24.21.0-linux-x64.tar.xz
