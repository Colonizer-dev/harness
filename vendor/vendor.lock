# ponytail is github.com/DietrichGebert/ponytail at tag v4.12.0. MIT (LICENSE is staged with it). Pinned by
# tag, so the daily updater follows the repo's latest release like ECC's and superpowers' pins. Staged as a
# six-skill plugin (skills/ponytail, -review, -audit, -debt, -gain, -help), each a single SKILL.md. Neither
# upstream manifest is copied: the root plugin.json is a bare {"name": "ponytail"} with no version,
# description or skills (validate-plugins.mjs rejects it), and .claude-plugin/plugin.json declares a hooks
