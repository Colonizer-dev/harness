# .windsurf, .openclaw, .devin-plugin, .grok-plugin, .agents) plus the benchmark assets — because no
# third-party code ever runs in a colony, and the skills are instructions an agent reads. The skill list
# above is an allowlist: a new upstream skill fails staging until it is added to this arm of
